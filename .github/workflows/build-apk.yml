name: Build Super-LOOI APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK e NDK
        uses: android-actions/setup-android@v3

      - name: Instalar NDK
        run: sdkmanager --install "ndk;26.3.11579264"

      - name: Instalar dependencias e gerar APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm --filter @super-looi/nsh exec node --import tsx scripts/nsh.ts package --target android

      - name: Enviar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: super-looi-android-apk
          path: '**/*.apk'
