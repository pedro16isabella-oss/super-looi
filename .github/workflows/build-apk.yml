name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --no-frozen-lockfile

      - name: Compilar pacotes (na ordem certa)
        run: pnpm --filter "@super-looi/runtime..." build

      - name: Salvar resultado para download
        uses: actions/upload-artifact@v4
        with:
          name: super-looi-build
          path: packages/*/dist
          if-no-files-found: warn
